name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libssl-dev libfuse3-dev libyaml-cpp-dev libcurl4-openssl-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure

  macos-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake openssl@3 pkg-config yaml-cpp curl
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMACHA_ENABLE_FUSE=OFF -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DCURL_ROOT="$(brew --prefix curl)"
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
