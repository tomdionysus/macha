# SPDX-License-Identifier: GPL-3.0-or-later
#
# tools/ci.sh on GitHub's runners: format and SPDX checks, the release build
# with every test binary, clang-tidy, the ASan and UBSan build with the same
# tests, and the coverage build, its report sent to Codecov. Dannan is built
# from its tag first. The run on a cluster node stays the gate for what needs
# real disks and peers.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  DANNAN_VERSION: "0.5.3"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      # LeakSanitizer needs ptrace to stop the process's threads.
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git ca-certificates \
            libssl-dev libcurl4-openssl-dev libyaml-cpp-dev zlib1g-dev libboost-dev \
            fuse3 libfuse3-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libtorrent-rasterbar-dev \
            clang-format-19 clang-tidy-19 lcov python3 \
            curl gnupg  # Codecov's uploader verifies its own signature

      - name: Build and install Dannan
        run: |
          git clone --depth 1 --branch "$DANNAN_VERSION" https://github.com/tomdionysus/dannan.git /opt/dannan-src
          cmake -S /opt/dannan-src -B /opt/dannan-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /opt/dannan-build -j "$(nproc)"
          cmake --install /opt/dannan-build --prefix /usr/local
          ldconfig

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the version string

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and test
        run: sh tools/ci.sh --local

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: build-coverage/coverage/coverage.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
